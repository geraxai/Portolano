*{box-sizing:border-box}
html,body{height:100%}

button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:"IBM Plex Serif",Georgia,serif;text-wrap:balance}

h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600;color:var(--ink2)}
a{color:var(--brand)}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100%}
nav.side{background:var(--brand);color:var(--brand-ink);padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
nav.side .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:8px}
nav.side .logo svg{flex:none}
nav.side .logo b{font-family:"IBM Plex Serif",Georgia,serif;font-size:19px;font-weight:600;letter-spacing:.02em}
nav.side .logo small{display:block;font-size:11px;opacity:.75;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
nav.side button{background:none;border:0;color:inherit;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer;opacity:.82;display:flex;align-items:center;gap:9px;font-size:14px}
nav.side button:hover{background:rgba(255,255,255,.1);opacity:1}
nav.side button[aria-selected="true"]{background:rgba(255,255,255,.18);opacity:1;font-weight:600}
.navq{padding:0 2px 8px}.navq input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:13px;padding:7px 9px}.navq input::placeholder{color:rgba(255,255,255,.6)}.navq input:focus{background:rgba(255,255,255,.2);outline:2px solid rgba(255,255,255,.35)}
nav.side .foot{margin-top:auto;font-size:11px;opacity:.7;padding:8px 10px;line-height:1.5}
main{padding:22px 28px 40px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top .spacer,.spacer{flex:1}
.stato{font-size:12px;color:var(--mute)}
.panel{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.panel-b{padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field.w2{grid-column:span 2}.field.full{grid-column:1/-1}
.field label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
input.num,td.num,th.num,.num{text-align:right;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:13px}
input.auto{color:var(--brass);font-style:italic}
textarea{min-height:64px;resize:vertical}
.btn{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--paper2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand2)}
.btn.danger{color:var(--no);border-color:var(--no)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.lnk{border:0;background:none;color:var(--brand);text-decoration:underline;padding:0;font-size:inherit}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:500;white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:var(--paper2)}
tr.hl td{background:var(--brass-bg)}
tr.tot td{font-weight:600;border-top:2px solid var(--line)}
tfoot td{font-weight:600}
.chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:500;white-space:nowrap;vertical-align:middle}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.no{background:var(--no-bg);color:var(--no)}.chip.brass{background:var(--brass-bg);color:var(--brass)}.chip.grey{background:var(--paper2);color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px}
.tile .k{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:20px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--ink2);margin-top:2px}
.tile.warn{border-left:4px solid var(--warn)}.tile.no{border-left:4px solid var(--no)}.tile.ok{border-left:4px solid var(--ok)}
.sub{font-size:12px;color:var(--mute)}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn);border-radius:6px;padding:10px 12px;margin:8px 0;color:var(--ink)}
.okbox{background:var(--ok-bg);border-radius:6px;padding:8px 12px;margin:8px 0}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line2);padding:0 8px}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--ink2)}
.subtabs button[aria-selected="true"]{border-bottom-color:var(--brand);color:var(--ink);font-weight:600}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.modes button{border:0;background:var(--paper);padding:6px 12px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.pos{color:var(--no)}.neg{color:var(--ok)}
.bands{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:4px 8px;align-items:center;max-width:520px}
.bands input{padding:4px 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.help p{max-width:70ch}
kbd{background:var(--paper2);border-radius:3px;padding:0 4px;font-family:"IBM Plex Mono",monospace;font-size:12px}
details summary{cursor:pointer;font-weight:600}
/* documento */
.docwrap{position:fixed;inset:0;background:rgba(21,38,44,.55);z-index:40;overflow:auto;padding:24px 12px}
.docbar{max-width:800px;margin:0 auto 10px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.doc{max-width:800px;margin:0 auto;background:#fff;color:#111;padding:44px 48px;font:12.5px/1.45 "IBM Plex Sans",Arial,sans-serif;min-height:1000px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.doc *{color:#111}
.doc .lh{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid var(--docc,#0e4e5c);padding-bottom:10px;margin-bottom:14px}

.doc .lh .t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#444;margin-top:2px}
.doc .lh .c{font-size:11px;color:#333;text-align:right;line-height:1.5}
.doc .lh.center .c{text-align:center}
.doc .lh img{max-height:70px;max-width:220px}
.doc .titolo{font-family:"IBM Plex Serif",Georgia,serif;font-size:17px;font-weight:600;margin:16px 0 4px;letter-spacing:.02em}
.doc .messrs{border:1px solid #bbb;padding:8px 12px;min-width:260px;display:inline-block;white-space:pre-line;margin:6px 0 10px}
.doc .kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;font-size:12px;margin:8px 0 14px}
.doc .kv div b{display:inline-block;min-width:110px;font-weight:600;color:#333}
.doc table{width:100%;border-collapse:collapse;margin:6px 0}
.doc th{background:#f0f3f4;color:#222;font-size:10.5px;letter-spacing:.06em;border-bottom:1px solid #999;padding:6px 8px}
.doc td{padding:5px 8px;border-bottom:1px solid #e1e1e1;font-size:12px}
.doc td.n,.doc th.n{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc tr.tot td{border-top:1.5px solid #333;border-bottom:0;font-weight:600;font-size:13px}
.doc .bank{margin-top:16px;font-size:11.5px;border-left:3px solid var(--docc,#0e4e5c);padding-left:10px;line-height:1.5}
.doc .firma{margin-top:26px;display:flex;justify-content:space-between;font-size:12px;align-items:flex-end}
.doc .firma .l{border-top:1px solid #333;padding-top:4px;min-width:200px;text-align:center}
.doc .piede{margin-top:26px;border-top:1px solid #ccc;padding-top:6px;font-size:10px;color:#555;text-align:center}
.doc .nota{font-size:11px;color:#444;margin-top:8px}
@media (max-width:820px){.app{grid-template-columns:1fr}nav.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px 12px;gap:2px}nav.side .logo{width:100%;border:0;padding:4px 6px 8px;margin:0}.navq{width:100%;padding:0 0 6px}nav.side button{padding:7px 9px;font-size:13px}nav.side .foot{display:none}main{padding:16px 16px 40px}.field.w2{grid-column:span 1}.doc{padding:24px 18px}}

@media print{body{background:#fff}.app,.toast{display:none!important}.docwrap{position:static;background:none;padding:0;overflow:visible}.docbar{display:none}.doc{box-shadow:none;max-width:none;padding:0;min-height:0}@page{margin:16mm}}

function rate(tab,gt){ gt=num(gt); if(!gt||!tab||!tab.bands||!tab.bands.length) return 0; var b=tab.bands,last=b[b.length-1];
  if(gt>last[1]) return r2(last[2]+Math.ceil((gt-last[1])/tab.step)*tab.extra);
  var r=b[0][2]; for(var i=0;i<b.length;i++) if(gt>=b[i][0]) r=b[i][2]; return r; }
function calcAuto(tipo,sc){ var C=S.cfg, p=sc.pda||{}, gt=num(sc.gt)||0, nt=num(sc.nt)||0;
  if(tipo==="pil") return r2(rate(C.pil,gt)*(num(p.nPil)||0));
  if(tipo==="orm") return r2(rate(C.orm,gt)*(num(p.nOrm)||0));
  if(tipo==="tug"){ var nT=num(p.nTug)||0, tugs=num(p.tugs)||0; if(!nT||!tugs) return 0; var tr=(tugs>=2&&p.transfer)?(num(C.transfer)||0):0; return r2(rate(C.tug,gt)*nT*tugs+tr); }
  if(tipo==="anc"){ var c=C.anc[p.anc]; return c? r2(nt*c) : 0; }
  if(tipo==="chim"){ return num(C.chim[p.chim])||0; }
  return 0; }
function spiegaAuto(tipo,sc){ var C=S.cfg,p=sc.pda||{},gt=num(sc.gt)||0;
  if(tipo==="pil") return "tariffa GT € "+eur(rate(C.pil,gt))+" × "+(p.nPil||0)+" prestazioni";
  if(tipo==="orm") return "tariffa GT € "+eur(rate(C.orm,gt))+" × "+(p.nOrm||0)+" prestazioni";
  if(tipo==="tug") return "tariffa GT € "+eur(rate(C.tug,gt))+" × "+(p.nTug||0)+" prestazioni × "+(p.tugs||0)+" rimorchiatori"+((num(p.tugs)>=2&&p.transfer)?" + trasferimento € "+eur(C.transfer):"");
  if(tipo==="anc") return p.anc? "NT "+(sc.nt||0)+" × "+C.anc[p.anc] : "nessuna tassa d'ancoraggio";
  if(tipo==="chim") return p.chim? "tariffa chimico: "+p.chim : "nessun intervento chimico";
  return ""; }

function normFatt(n){ var t=upper(n).replace(/[^A-Z0-9]/g,""); var d=t.replace(/[^0-9]/g,""); return (d.length>=2?d:t).replace(/^0+(?=\d)/,""); }

    h+='</tbody><tfoot><tr><td colspan="5">Totale</td><td class="num">'+eur(tot)+'</td><td colspan="2"></td></tr></tfoot></table></div>'; }

/* ---------- riepilogo ---------- */
function riepilogo(){ var lst=listaScali(), Y=S.anno||String(new Date().getFullYear()), anni={}; lst.forEach(function(s){ anni[anno(s.eta||s.creato)]=1; }); var ann=lst.filter(function(s){ return anno(s.eta||s.creato)===Y; });
  var tp=0,tf=0,inc=0,daInc=0,prev=0; ann.forEach(function(s){ var p=totPda(s),f=totFda(s),i=incassato(s); tp+=p; tf+=f; inc+=i; if(!s.pagDir&&f>i) daInc+=f-i; if(statoScalo(s).t==="preventivo") prev++; });
  var h='<div class="top"><h1>Riepilogo</h1><div class="field"><select id="rAnno" aria-label="Anno">'+Object.keys(anni).sort().reverse().map(function(y){ return opt(y,y,Y); }).join("")+(anni[Y]?"":opt(Y,Y,Y))+'</select></div></div>';
  h+='<div class="tiles"><div class="tile"><div class="k">Scali '+Y+'</div><div class="v">'+ann.length+'</div><div class="s">'+prev+' ancora a preventivo</div></div>'+
    '<div class="tile"><div class="k">Totale PDA</div><div class="v">€ '+eur(tp)+'</div><div class="s">preventivi inviati</div></div>'+
    '<div class="tile '+(tf>tp?"warn":"")+'"><div class="k">Totale FDA</div><div class="v">€ '+eur(tf)+'</div><div class="s">'+(tf&&tp?(tf>=tp?"+":"")+eur(tf-tp)+" rispetto ai PDA":"")+'</div></div>'+
    '<div class="tile '+(daInc>0?"no":"ok")+'"><div class="k">Da incassare</div><div class="v">€ '+eur(daInc)+'</div><div class="s">incassato € '+eur(inc)+'</div></div>'+
    '<div class="tile '+(daPagare()>0?"warn":"")+'"><div class="k">Da pagare ai fornitori</div><div class="v">€ '+eur(daPagare())+'</div><div class="s">fatture aperte, tutti gli anni</div></div></div>';
  var g=gruppiDoppioni(); if(g.length){ h+='<div class="warnbox"><details'+(g.length<=3?" open":"")+'><summary>'+g.length+' possibili fatture addebitate 2 volte</summary><ul style="margin:6px 0 0">'+g.map(function(x){ return '<li>'+esc(x.m)+': '+x.lista.map(function(s){ var sc=S.scali[s.scalo]||{}; return '<button class="btn lnk" data-go="'+esc(sc.id||"")+'" data-hl="'+s.id+'">prot. '+esc(sc.prot||"?")+' '+esc(sc.nave||"")+'</button> '+esc(s.fornitore)+' € '+eur(s.totale); }).join(" · ")+'</li>'; }).join("")+'</ul></details></div>'; }
  /* scostamenti medi per voce: dove il preventivo sbaglia di più */
  var acc={}; ann.forEach(function(s){ if(!totFda(s)) return; righeConto(s,"fda").forEach(function(x){ if(x.extra) return; var a=acc[x.k]||(acc[x.k]={label:x.label,p:0,f:0,n:0}); a.p+=x.pda.val; a.f+=x.fda.val; if(x.pda.val||x.fda.val) a.n++; }); });
  var sc=Object.keys(acc).map(function(k){ return acc[k]; }).filter(function(a){ return a.n&&Math.abs(a.f-a.p)>0.5; }).sort(function(a,b){ return Math.abs(b.f-b.p)-Math.abs(a.f-a.p); }).slice(0,10);
  h+='<div class="panel"><div class="panel-h"><h2>Preventivo e consuntivo per voce</h2><span class="sub">scali '+Y+' con FDA · dove il PDA si scosta di più</span></div>';
  if(!sc.length) h+='<div class="panel-b sub">Nessuno scostamento rilevante: PDA e FDA coincidono, oppure non ci sono ancora consuntivi.</div>';
  else{ h+='<div class="scroll"><table><thead><tr><th>Voce</th><th class="num">Scali</th><th class="num">PDA €</th><th class="num">FDA €</th><th class="num">Diff. €</th><th class="num">Diff. %</th></tr></thead><tbody>';
    sc.forEach(function(a){ var d=a.f-a.p; h+='<tr><td>'+esc(a.label)+'</td><td class="num">'+a.n+'</td><td class="num">'+eur(a.p)+'</td><td class="num">'+eur(a.f)+'</td><td class="num '+(d>0?"pos":"neg")+'">'+(d>0?"+":"")+eur(d)+'</td><td class="num">'+(a.p?((d/a.p*100).toFixed(0)+"%"):"—")+'</td></tr>'; }); h+='</tbody></table></div>'; }
  h+='</div>';
  var mesi=[]; for(var i=0;i<12;i++) mesi.push({n:0,p:0,f:0}); ann.forEach(function(s){ var m=parseInt((s.eta||s.creato||"").slice(5,7),10)-1; if(m>=0){ mesi[m].n++; mesi[m].p+=totPda(s); mesi[m].f+=totFda(s); } });
  h+='<div class="panel"><div class="panel-h"><h2>Scali per mese</h2></div><div class="scroll"><table><thead><tr><th>Mese</th><th class="num">Scali</th><th class="num">PDA €</th><th class="num">FDA €</th></tr></thead><tbody>';
  mesi.forEach(function(m,i){ if(!m.n) return; h+='<tr><td>'+MESI[i]+'</td><td class="num">'+m.n+'</td><td class="num">'+eur(m.p)+'</td><td class="num">'+eur(m.f)+'</td></tr>'; }); h+='</tbody></table></div></div>';

/* ---------- guida ---------- */
function guida(){ return '<div class="top"><h1>Guida</h1></div><div class="panel help"><div class="panel-b">'+
 '<p><strong>Portolano</strong> unisce in un solo archivio la pratica di scalo (dati nave e viaggio, come in <em>Pratiche di Scalo</em>) e il mastrino dei conti nave (fatture fornitori, PDA/FDA, incassi, come in <em>Mastrino Approdi</em>). Ogni scalo è una scheda con sei pagine.</p>'+
 '<p><strong>Nave &amp; viaggio</strong> — anagrafica della nave (IMO, bandiera, GT/NT, LOA…) e del viaggio (ETA/ETD, ormeggio, operazione, carico, cliente). Scrivendo il nome di una nave già in archivio, GT/NT e dati si ripropongono da soli.</p>'+
 '<p><strong>Intestazione</strong> — il destinatario del conto (Messrs) riga per riga, riprendibile dagli scali precedenti, e la banca da indicare sul documento. La carta intestata dell\'agenzia (ragione sociale, indirizzo, recapiti, P.IVA, logo, colore, lingua, firma) si imposta una volta in <em>Impostazioni → Intestazione</em> e vale per tutti i documenti.</p>'+
 '<p><strong>PDA preventivo</strong> — calcolato dalle tariffe per scaglioni di GT: piloti, ormeggiatori e rimorchiatori × numero di prestazioni (con trasferimento rimorchiatori a 2 mezzi), tassa d\'ancoraggio per NT, chimico, più gli importi standard delle voci d\'agenzia. Ogni voce si può forzare a mano; le voci in corsivo ottone sono automatiche. Gli scaglioni sono quelli dei fogli PILOTI, ORMEGGIATORI, TUG e TASSA ANC del file APPRODO.xlsx e si modificano in <em>Impostazioni → Tariffe</em>.</p>'+
 '<p><strong>Fatture fornitori</strong> — ogni fattura si registra sulla voce del conto (proposta automaticamente dal fornitore: PILOTI → Pilotage, SIDRA → Fresh water…). Se una fattura risulta già registrata (stesso fornitore e numero, o stessa nave/importo/data) l\'app avvisa prima di salvare e la segna con <span class="chip no">addebitata 2 volte</span> ovunque compaia.</p>'+
 '<p><strong>Conto PDA / FDA</strong> — il consuntivo si compone dalle fatture registrate, con le voci interne senza fattura (H.Master, informer, ISPS, bolli…) riprese dal PDA; il <em>Confronto</em> mette a fianco preventivo e consuntivo voce per voce e in rosso i costi in più. <strong>Stampa / PDF</strong> apre il documento con carta intestata, Messrs, tabella nave, voci, totale, banca e firma: si salva in PDF dalla finestra di stampa del browser.</p>'+
 '<p><strong>Incassi</strong> — bonifici ricevuti dal cliente; lo stato dello scalo (preventivo, da incassare, parziale, saldato) si aggiorna da solo. Con <em>PAG DIR</em> il cliente paga i fornitori direttamente e lo scalo resta fuori dai residui.</p>'+
 '<p><strong>Fatture</strong> — la maschera per registrare le fatture fornitori appena arrivano, anche in blocco e senza conoscere ancora lo scalo: al passo 2 si sceglie l\'approdo (in cima all\'elenco gli scali con ETA vicina alla data fattura) e con <em>Abbina</em> la fattura entra nel conto FDA di quello scalo. Le fatture in attesa compaiono anche nella scheda di ogni scalo (<em>abbina a questo scalo</em>) e nell\'estratto conto fornitori come <em>da abbinare</em>.</p>'+
 '<p><strong>Cruscotto e ricerca</strong> — all\'apertura il cruscotto mostra navi in porto e in arrivo, fatture in scadenza, clienti in ritardo e fatture da abbinare; la casella in alto a sinistra cerca in tutto l\'archivio (navi, IMO, clienti, fornitori, numeri di fattura). Ogni fattura può avere <em>imponibile, IVA e ritenuta</em> (il totale si calcola da solo), essere una <em>nota di credito</em>, avere <em>più pagamenti</em> (acconti) e un <em>allegato</em> (link, oppure il PDF conservato in questo browser). In <em>Impostazioni → Archivio</em> si chiude il periodo contabile, si imposta il backup automatico e si consulta il registro delle modifiche.</p>'+
 '<p><strong>Contabilità</strong> — i prospetti da contabile, tutti esportabili in CSV (Excel) e stampabili: <em>Registro fatture</em> ricevute con filtri e ricerca; <em>Scadenzario fornitori</em> (sospesi passivi per fornitore, con scadenza = data fattura + 30 giorni salvo scadenza indicata, e ritardo in giorni); <em>Partite aperte clienti</em> (conti FDA non ancora incassati, per cliente, con anzianità); <em>Estratto conto cliente</em> (addebiti FDA e incassi in ordine di data con saldo progressivo); <em>Prima nota</em> (incassi e pagamenti per mese e per banca). Nelle fatture la voce del conto può essere anche scritta a mano libera (<em>Altra voce</em>): nel FDA le fatture con lo stesso nome si sommano in una riga e si confrontano con la voce aggiuntiva del PDA che ha lo stesso nome.</p>'+
 '<p><strong>Fornitori</strong> — estratto conto per fornitore con fatture aperte e pagate, per anno; <strong>Riepilogo</strong> — totali dell\'anno, da incassare e da pagare, doppioni, voci dove il preventivo si scosta di più dal consuntivo, scali per mese.</p>'+
 '<p><strong>Archivio</strong> — i dati restano in questo browser e, quando l\'app è aperta da claude.ai, anche nell\'archivio condiviso con i colleghi. In <em>Impostazioni → Archivio</em> si esporta un backup completo, si reimporta, e si importano i dati esistenti dal backup di Pratiche di Scalo (file BACKUP_PRATICHE_*.json) e dal CSV esportato dal Mastrino Approdi (mastrino_approdi.csv).</p>'+
 '</div></div>'; }

function caricaSeed(){ var d=window.PORTOLANO_SEED; if(!d) return 0; var n=0; for(var k in d.scali||{}){ if(!S.scali[k]){ S.scali[k]=d.scali[k]; n++; } } for(var j in d.spese||{}){ if(!S.spese[j]) S.spese[j]=d.spese[j]; } if(d.cfg&&!Object.keys(S.cfgRaw).length){ S.cfgRaw=d.cfg; S.cfg=merge(CFG_DEFAULT,S.cfgRaw); } salvaLocale(); return n; }
/* ---------- avvio ---------- */
document.getElementById("nav").addEventListener("click",function(e){ var b=e.target.closest("[data-view]"); if(!b) return; S.view=b.getAttribute("data-view"); S.sel=null; S.editSpesa=null; S.dupWarn=null; S.bozza=null; S.pagTmp=null; S.hl=null; S.qg=""; var q=document.getElementById("qg"); if(q) q.value=""; render(); });
document.getElementById("qg").addEventListener("input",function(){ S.qg=this.value; S.sel=null; S.editSpesa=null; S.bozza=null; S.pagTmp=null; if(S.qg.trim()){ S.view="cerca"; } else if(S.view==="cerca") S.view="cruscotto"; render(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&S.doc){ S.doc=null; var w=document.getElementById("docwrap"); if(w) w.remove(); } });
leggiLocale(); if(window.PORTOLANO_SEED&&!Object.keys(S.scali).length){ caricaSeed(); } render();
(async function(){ if(!(window.claude&&window.claude.use)) return;
  try{ var u=await Promise.all([claude.use("db").catch(function(){ return null; }),claude.use("user").catch(function(){ return null; }),claude.use("downloads").catch(function(){ return null; })]); S.db=u[0]; S.downloads=u[2];
    if(u[1]){ try{ var me=await u[1].me(); S.user={id:me&&me.id,nome:(me&&me.name)||""}; }catch(e){} }
    if(!S.db){ render(); return; }
    S.db.collection("scali").onSnapshot(function(sn){ var m={}; sn.docs.forEach(function(d){ var v=clone(d.data()||{}); v.id=v.id||d.id; m[v.id]=v; }); if(sn.docs.length||Object.keys(S.scali).length===0) S.scali=m; salvaLocale(); render(); },function(){});
    S.db.collection("spese").onSnapshot(function(sn){ var m={}; sn.docs.forEach(function(d){ var v=clone(d.data()||{}); v.id=v.id||d.id; m[v.id]=v; }); if(sn.docs.length||Object.keys(S.spese).length===0) S.spese=m; salvaLocale(); render(); },function(){});
    S.db.doc("config/main").onSnapshot(function(sn){ if(sn&&sn.exists&&sn.data()){ S.cfgRaw=clone(sn.data()); S.cfg=merge(CFG_DEFAULT,S.cfgRaw); salvaLocale(); render(); } },function(){});
    /* prima apertura con archivio condiviso vuoto ma dati locali: li carica */
    setTimeout(async function(){ try{ var q=await S.db.collection("scali").limit(1).get(); if(!q.docs.length&&Object.keys(S.scali).length){ for(var k in S.scali) await S.db.doc("scali/"+k).set(S.scali[k]); for(var j in S.spese) await S.db.doc("spese/"+j).set(S.spese[j]); if(Object.keys(S.cfgRaw).length) await S.db.doc("config/main").set(S.cfgRaw); avviso("Archivio locale caricato in quello condiviso."); } }catch(e){} },1500);
  }catch(e){ render(); } })();
</script>
