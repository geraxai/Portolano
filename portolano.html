a nave già in archivio, GT/NT e dati si ripropongono da soli.</p><p><strong>Intestazione</strong> — il destinatario del conto (Messrs) riga per riga, riprendibile dagli scali precedenti, e la banca da indicare sul documento. La carta intestata dell'agenzia (ragione sociale, indirizzo, recapiti, P.IVA, logo, colore, lingua, firma) si imposta una volta in <em>Impostazioni → Intestazione</em> e vale per tutti i documenti.</p><p><strong>PDA preventivo</strong> — calcolato dalle tariffe per scaglioni di GT: piloti, ormeggiatori e rimorchiatori × numero di prestazioni (con trasferimento rimorchiatori a 2 mezzi), tassa d'ancoraggio per NT, chimico, più gli importi standard delle voci d'agenzia. Ogni voce si può forzare a mano; le voci in corsivo ottone sono automatiche. Gli scaglioni sono quelli dei fogli PILOTI, ORMEGGIATORI, TUG e TASSA ANC del file APPRODO.xlsx e si modificano in <em>Impostazioni → Tariffe</em>.</p><p><strong>Fatture fornitori</strong> — ogni fattura si registra sulla voce del conto (proposta automaticamente dal fornitore: PILOTI → Pilotage, SIDRA → Fresh water…). Se una fattura risulta già registrata (stesso fornitore e numero, o stessa nave/importo/data) l'app avvisa prima di salvare e la segna con <span class="chip no">addebitata 2 volte</span> ovunque compaia.</p><p><strong>Conto PDA / FDA</strong> — il consuntivo si compone dalle fatture registrate, con le voci interne senza fattura (H.Master, informer, ISPS, bolli…) riprese dal PDA; il <em>Confronto</em> mette a fianco preventivo e consuntivo voce per voce e in rosso i costi in più. <strong>Stampa / PDF</strong> apre il documento con carta intestata, Messrs, tabella nave, voci, totale, banca e firma: si salva in PDF dalla finestra di stampa del browser.</p><p><strong>Incassi</strong> — bonifici ricevuti dal cliente; lo stato dello scalo (preventivo, da incassare, parziale, saldato) si aggiorna da solo. Con <em>PAG DIR</em> il cliente paga i fornitori direttamente e lo scalo resta fuori dai residui.</p><p><strong>Fatture</strong> — la maschera per registrare le fatture fornitori appena arrivano, anche in blocco e senza conoscere ancora lo scalo: al passo 2 si sceglie l'approdo (in cima all'elenco gli scali con ETA vicina alla data fattura) e con <em>Abbina</em> la fattura entra nel conto FDA di quello scalo. Le fatture in attesa compaiono anche nella scheda di ogni scalo (<em>abbina a questo scalo</em>) e nell'estratto conto fornitori come <em>da abbinare</em>.</p><p><strong>Contabilità</strong> — i prospetti da contabile, tutti esportabili in CSV (Excel) e stampabili: <em>Registro fatture</em> ricevute con filtri e ricerca; <em>Scadenzario fornitori</em> (sospesi passivi per fornitore, con scadenza = data fattura + 30 giorni salvo scadenza indicata, e ritardo in giorni); <em>Partite aperte clienti</em> (conti FDA non ancora incassati, per cliente, con anzianità); <em>Estratto conto cliente</em> (addebiti FDA e incassi in ordine di data con saldo progressivo); <em>Prima nota</em> (incassi e pagamenti per mese e per banca). Nelle fatture la voce del conto può essere anche scritta a mano libera (<em>Altra voce</em>): nel FDA le fatture con lo stesso nome si sommano in una riga e si confrontano con la voce aggiuntiva del PDA che ha lo stesso nome.</p><p><strong>Fornitori</strong> — estratto conto per fornitore con fatture aperte e pagate, per anno; <strong>Riepilogo</strong> — totali dell'anno, da incassare e da pagare, doppioni, voci dove il preventivo si scosta di più dal consuntivo, scali per mese.</p><p><strong>Archivio</strong> — i dati restano in questo browser e, quando l'app è aperta da claude.ai, anche nell'archivio condiviso con i colleghi. In <em>Impostazioni → Archivio</em> si esporta un backup completo, si reimporta, e si importano i dati esistenti dal backup di Pratiche di Scalo (file BACKUP_PRATICHE_*.json) e dal CSV esportato dal Mastrino Approdi (mastrino_approdi.csv).</p></div></div>`}function impostazioni(){var a=[["agenzia","Intestazione"],["
