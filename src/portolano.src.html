function eur(n){ if(n===null||n===undefined||n===""||isNaN(n)) return "—"; return Number(n).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function eurEn(n){ return Number(n||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(v){ if(v===null||v===undefined) return null; if(typeof v==="number") return isNaN(v)?null:v; var t=String(v).trim().replace(/€|\s/g,""); if(!t) return null;
  if(/,\d{1,2}$/.test(t)) t=t.replace(/\./g,"").replace(",","."); else t=t.replace(/,/g,""); var n=parseFloat(t); return isNaN(n)?null:n; }
function r2(n){ return Math.round((Number(n)||0)*100)/100; }
function esc(s){ return String(s===null||s===undefined?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function dEn(s){ if(!s) return ""; var p=String(s).split("-"); if(p.length!==3) return s; var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return parseInt(p[2],10)+" "+m[parseInt(p[1],10)-1]+" "+p[0]; }

function merge(base,extra){ var o=clone(base); if(!extra||typeof extra!=="object") return o; for(var k in extra){ if(extra[k]&&typeof extra[k]==="object"&&!Array.isArray(extra[k])&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])) o[k]=merge(o[k],extra[k]); else o[k]=clone(extra[k]); } return o; }

/* ---------- motore tariffe (scaglioni per GT, come i fogli PILOTI / ORMEGGIATORI / TUG) ---------- */
function rate(tab,gt){ gt=num(gt); if(!gt||!tab||!tab.bands||!tab.bands.length) return 0; var b=tab.bands,last=b[b.length-1];
  if(gt>last[1]) return r2(last[2]+Math.ceil((gt-last[1])/tab.step)*tab.extra);
  var r=b[0][2]; for(var i=0;i<b.length;i++) if(gt>=b[i][0]) r=b[i][2]; return r; }
function calcAuto(tipo,sc){ var C=S.cfg, p=sc.pda||{}, gt=num(sc.gt)||0, nt=num(sc.nt)||0;
  if(tipo==="pil") return r2(rate(C.pil,gt)*(num(p.nPil)||0));
  if(tipo==="orm") return r2(rate(C.orm,gt)*(num(p.nOrm)||0));
  if(tipo==="tug"){ var nT=num(p.nTug)||0, tugs=num(p.tugs)||0; if(!nT||!tugs) return 0; var tr=(tugs>=2&&p.transfer)?(num(C.transfer)||0):0; return r2(rate(C.tug,gt)*nT*tugs+tr); }
  if(tipo==="anc"){ var c=C.anc[p.anc]; return c? r2(nt*c) : 0; }
  if(tipo==="chim"){ return num(C.chim[p.chim])||0; }
  return 0; }
function spiegaAuto(tipo,sc){ var C=S.cfg,p=sc.pda||{},gt=num(sc.gt)||0;
  if(tipo==="pil") return "tariffa GT € "+eur(rate(C.pil,gt))+" × "+(p.nPil||0)+" prestazioni";
  if(tipo==="orm") return "tariffa GT € "+eur(rate(C.orm,gt))+" × "+(p.nOrm||0)+" prestazioni";
  if(tipo==="tug") return "tariffa GT € "+eur(rate(C.tug,gt))+" × "+(p.nTug||0)+" prestazioni × "+(p.tugs||0)+" rimorchiatori"+((num(p.tugs)>=2&&p.transfer)?" + trasferimento € "+eur(C.transfer):"");
  if(tipo==="anc") return p.anc? "NT "+(sc.nt||0)+" × "+C.anc[p.anc] : "nessuna tassa d'ancoraggio";
  if(tipo==="chim") return p.chim? "tariffa chimico: "+p.chim : "nessun intervento chimico";
  return ""; }

/* scalo "vuoto" = creato con + Nuovo scalo e mai compilato: si riusa invece di crearne un altro e si elimina appena lo si lascia */
function scaloVuoto(sc){ if(!sc) return false; if(["nave","imo","callSign","cliente","intestazione","attn","carico","quantita","note","operazione","ricevitore","master","provenienza","prossimo","ormeggio","flag","tipo"].some(function(k){ return String(sc[k]||"").trim()!==""; })) return false;
  if(num(sc.gt)!==null||num(sc.nt)!==null||(sc.incassi&&sc.incassi.length)) return false; var p=sc.pda||{}, f=sc.fda||{}; if((p.extra&&p.extra.length)||(f.extra&&f.extra.length)||p.inviato||f.inviato||f.numero||num(p.stamp)||num(f.stamp)) return false;
  var k; for(k in (p.items||{})) if(String(p.items[k])!=="") return false; for(k in (f.items||{})) if(String(f.items[k])!=="") return false; for(k in S.spese) if(S.spese[k].scalo===sc.id) return false; return true; }
function scaloVuotoEsistente(){ var L=listaScali(); for(var i=0;i<L.length;i++) if(scaloVuoto(L[i])) return L[i]; return null; }
async function creaScalo(){ if(S.creando) return null; S.creando=true; try{ var n=scaloVuotoEsistente(); if(!n){ n=nuovoScalo(); await scriviScalo(n); } S.nuovi=S.nuovi||{}; S.nuovi[n.id]=1; return n; } finally{ S.creando=false; } }

  ids.forEach(function(id){ delete N[id]; try{ cancellaScalo(id); }catch(e){} }); return ids.length; }

function pagamentiDi(s){ if(s.pagamenti&&s.pagamenti.length) return s.pagamenti; if(s.dataPagamento&&num(s.totale)!==null) return [{data:s.dataPagamento,importo:num(s.totale),modo:s.modo||"",note:"",legacy:true}]; return []; }
function pagatoDi(s){ var t=0; pagamentiDi(s).forEach(function(p){ t+=num(p.importo)||0; }); return r2(t); }
function residuoDi(s){ var t=num(s.totale); if(t===null) return 0; return r2(t-pagatoDi(s)); }
function statoSpesa(s){ var t=num(s.totale); if(t===null) return "aperta"; if(t<0) return residuoDi(s)>=-0.005?"pagata":"aperta"; if(residuoDi(s)<=0.005) return "pagata"; return pagatoDi(s)>0.005?"parziale":"aperta"; }
function chipPag(s){ var st=statoSpesa(s); if(st==="pagata"){ var u=pagamentiDi(s).slice(-1)[0]||{}; return '<span class="chip ok">'+dIt(s.dataPagamento||u.data)+(s.modo?" · "+esc(s.modo):"")+'</span>'; } if(st==="parziale") return '<span class="chip warn">parziale · resta € '+eur(residuoDi(s))+'</span>'; return '<span class="chip warn">'+(isComm(s)?"da incassare":"aperta")+'</span>'; }
function normalizzaPagamenti(e){ e.pagamenti=(e.pagamenti||[]).filter(function(p){ return num(p.importo)!==null; }).map(function(p){ return {data:p.data||"",importo:r2(num(p.importo)),modo:p.modo||"",note:p.note||""}; });
  if(e.pagamenti.length){ var res=residuoDi(e); if(res<=0.005){ var u=e.pagamenti[e.pagamenti.length-1]; e.dataPagamento=u.data||e.dataPagamento||oggi(); if(!e.modo&&u.modo) e.modo=u.modo; } else e.dataPagamento=""; } else if(!e.dataPagamento) e.dataPagamento=""; return e; }

/* ---------- guida ---------- */
function guida(){ return '<div class="top"><h1>Guida</h1></div><div class="panel help"><div class="panel-b">'+
 '<p><strong>Portolano</strong> unisce in un solo archivio la pratica di scalo (dati nave e viaggio, come in <em>Pratiche di Scalo</em>) e il mastrino dei conti nave (fatture fornitori, PDA/FDA, incassi, come in <em>Mastrino Approdi</em>). Ogni scalo è una scheda con sei pagine.</p>'+
 '<p><strong>Nave &amp; viaggio</strong> — anagrafica della nave (IMO, bandiera, GT/NT, LOA…) e del viaggio (ETA/ETD, ormeggio, operazione, carico, cliente). Scrivendo il nome di una nave già in archivio, GT/NT e dati si ripropongono da soli. <strong>Dati da Pratiche di Scalo</strong>: in cima alla pagina si carica il file esportato dall\'altra app (Archivio → <em>Estrai dati</em> = PORTOLANO_DATI_*.json, o Impostazioni → <em>Esporta archivio</em> = BACKUP_PRATICHE_*.json), poi <em>Scegli la pratica</em>: l\'elenco mette in cima le pratiche della stessa nave/IMO o della stessa data e con <em>Carica</em> nave, viaggio e (se vuoi) il PDA entrano nello scalo. Il file resta in memoria sul dispositivo: per gli scali successivi basta <em>Scegli la pratica</em>. <em>Importa tutte nell\'archivio</em> crea o aggiorna uno scalo per ogni pratica. In Pratiche di Scalo il pulsante <em>Per Portolano</em> (archivio, o in fondo alla pratica) salva il file di <strong>una sola nave</strong> (PORTOLANO_NAVE_*.json) con il <strong>PDA inviato</strong>: caricato nella scheda, nave, viaggio e PDA entrano nello scalo da soli, con gli stessi importi inviati al cliente. Premendo <em>+ Nuovo scalo</em> uno scalo vuoto già aperto viene riusato e gli scali lasciati vuoti si eliminano da soli.</p>'+
 '<p><strong>Intestazione</strong> — il destinatario del conto (Messrs) riga per riga, riprendibile dagli scali precedenti, e la banca da indicare sul documento. La carta intestata dell\'agenzia (ragione sociale, indirizzo, recapiti, P.IVA, logo, colore, lingua, firma) si imposta una volta in <em>Impostazioni → Intestazione</em> e vale per tutti i documenti.</p>'+
 '<p><strong>PDA preventivo</strong> — calcolato dalle tariffe per scaglioni di GT: piloti, ormeggiatori e rimorchiatori × numero di prestazioni (con trasferimento rimorchiatori a 2 mezzi), tassa d\'ancoraggio per NT, chimico, più gli importi standard delle voci d\'agenzia. Ogni voce si può forzare a mano; le voci in corsivo ottone sono automatiche. Gli scaglioni sono quelli dei fogli PILOTI, ORMEGGIATORI, TUG e TASSA ANC del file APPRODO.xlsx e si modificano in <em>Impostazioni → Tariffe</em>.</p>'+
 '<p><strong>Fatture fornitori</strong> — ogni fattura si registra sulla voce del conto (proposta automaticamente dal fornitore: PILOTI → Pilotage, SIDRA → Fresh water…). Se una fattura risulta già registrata (stesso fornitore e numero, o stessa nave/importo/data) l\'app avvisa prima di salvare e la segna con <span class="chip no">addebitata 2 volte</span> ovunque compaia. <strong>Ns fattura di commissione</strong>: nel campo <em>Documento</em> scegli «Ns fattura di commissione al fornitore» per registrare la provvigione che l\'azienda fattura a un fornitore (rimorchiatori, piloti…): non è un costo dello scalo, in Contabilità è una fattura emessa e nell\'estratto conto del fornitore va in avere, riducendo quanto gli dobbiamo; il suo incasso o la compensazione si registra come pagamento.</p>'+
 '<p><strong>Conto PDA / FDA</strong> — il consuntivo rispecchia le fatture registrate e assegnate allo scalo: quelle dei fornitori voce per voce e la ns fattura Fratelli Bonanno scomposta nelle sue voci (agency fees, ISPS, bolli, dogana…), il cui numero e data compaiono anche sul documento FDA; le voci interne senza fattura (H.Master, informer, ISPS, bolli…) sono riprese dal PDA solo finché allo scalo non è assegnata una ns fattura; il <em>Confronto</em> mette a fianco preventivo e consuntivo voce per voce e in rosso i costi in più. <strong>Stampa / PDF</strong> apre il documento con carta intestata, Messrs, tabella nave, voci, totale, banca e firma: si salva in PDF dalla finestra di stampa del browser.</p>'+
 '<p><strong>Incassi</strong> — bonifici ricevuti dal cliente; lo stato dello scalo (preventivo, da incassare, parziale, saldato) si aggiorna da solo. Con <em>PAG DIR</em> il cliente paga i fornitori direttamente e lo scalo resta fuori dai residui.</p>'+
 '<p><strong>Fatture</strong> — la maschera per registrare le fatture fornitori appena arrivano, anche in blocco e senza conoscere ancora lo scalo: al passo 2 si sceglie l\'approdo (in cima all\'elenco gli scali con ETA vicina alla data fattura) e con <em>Abbina</em> la fattura entra nel conto FDA di quello scalo. Le fatture in attesa compaiono anche nella scheda di ogni scalo (<em>abbina a questo scalo</em>) e nell\'estratto conto fornitori come <em>da abbinare</em>.</p>'+
 '<p><strong>General infos e ricerca</strong> — all\'apertura la pagina <em>General infos</em> mostra navi in porto e in arrivo, fatture in scadenza, clienti in ritardo e fatture da abbinare; la casella in alto a sinistra cerca in tutto l\'archivio (navi, IMO, clienti, fornitori, numeri di fattura). Ogni fattura può avere <em>imponibile, IVA e ritenuta</em> (il totale si calcola da solo), essere una <em>nota di credito</em>, avere <em>più pagamenti</em> (acconti) e un <em>allegato</em> (link, oppure il PDF conservato in questo browser). In <em>Impostazioni → Archivio</em> si chiude il periodo contabile, si imposta il backup automatico e si consulta il registro delle modifiche.</p>'+
 '<p><strong>Contabilità</strong> — i prospetti da contabile, tutti esportabili in CSV (Excel) e stampabili: <em>Registro fatture</em> ricevute con filtri e ricerca; <em>Scadenzario fornitori</em> (sospesi passivi per fornitore, con scadenza = data fattura + 30 giorni salvo scadenza indicata, e ritardo in giorni); <em>Partite aperte clienti</em> (conti FDA non ancora incassati, per cliente, con anzianità); <em>Estratto conto cliente</em> (addebiti FDA e incassi in ordine di data con saldo progressivo); <em>Prima nota</em> (incassi e pagamenti per mese e per banca). Nelle fatture la voce del conto può essere anche scritta a mano libera (<em>Altra voce</em>): nel FDA le fatture con lo stesso nome si sommano in una riga e si confrontano con la voce aggiuntiva del PDA che ha lo stesso nome.</p>'+
 '<p><strong>Fatture elettroniche</strong> — nella pagina <em>Fatture</em> il riquadro <em>Importa fatture elettroniche (XML)</em> legge i file XML (o .p7m) ricevuti dallo SDI: fornitore, numero, data, imponibile, IVA, ritenuta, totale, scadenza e descrizione si compilano da soli, l\'app propone la voce del conto e lo scalo e segnala le fatture già registrate; il fornitore scelto per una partita IVA viene ricordato per le volte successive.</p>'+
 '<p><strong>Importazione fatture (XML, PDF, ZIP)</strong> — nella pagina <em>Fatture</em> e nella pagina <em>Fornitori</em> puoi caricare gli XML/P7M dello SDI, i PDF delle fatture (letti dal testo; le scansioni senza testo non si leggono) o un intero <em>.zip</em> con tante fatture, anche in cartelle. Fornitore, voce, numero, importi e approdo vengono proposti da soli (nave, IMO o protocollo citati nel testo, altrimenti l\'approdo vicino alla data con un PDA compatibile); la colonna <em>Controlli</em> segnala le incoerenze: fattura già registrata, fornitore nuovo o diverso da quello della pagina, nessun approdo o più approdi possibili, importo lontano dal PDA, scalo già saldato, fattura intestata a un\'altra azienda.</p><p><strong>NS FATTURA = Fratelli Bonanno</strong> — le fatture registrate con fornitore <em>NS FATTURA</em> sono le fatture emesse dall\'azienda (agency fees). Nella registrazione e nel conto PDA/FDA restano una voce distinta come sempre; in <em>Contabilità</em> invece prendono il nome dell\'azienda (Impostazioni → Contabilità) e sono trattate come fatture <em>emesse</em>: stanno nel registro <em>Fatture emesse</em> e nel <em>Registro IVA</em> tra le vendite (IVA a debito), non tra le fatture ricevute, lo scadenzario fornitori o i pagamenti; nella pagina <em>Fornitori</em> il loro estratto conto è quello delle fatture emesse (fatturato, incassato, da incassare).</p>'+
 '<p><strong>Fatture emesse</strong> — nel <em>Conto PDA / FDA</em> il FDA può ricevere un numero progressivo di fattura (<em>assegna il prossimo numero</em>, formato in Impostazioni → Contabilità) e una data: compaiono sul documento stampato e nel registro <em>Fatture emesse</em> della Contabilità, che segnala numeri mancanti o doppi e mostra incassato e residuo per ogni fattura.</p>'+
 '<p><strong>Statistiche</strong> — in Contabilità, confronto anno su anno per cliente, nave, fornitore, operazione, ormeggio o mese: scali, PDA, FDA, costi fornitori, margine e incassi, con variazione percentuale.</p>'+
 '<p><strong>Estratti conto</strong> — la pagina <em>Fornitori</em> e, in Contabilità, <em>Estratto conto cliente</em> mostrano i movimenti in ordine di data con saldo progressivo: fatture (o conti FDA) da una parte, pagamenti (o incassi) dall\'altra, totali per mese, stato di ogni documento e riquadri con fatturato, pagato, saldo e scaduto. In alto la striscia dei fornitori/clienti con saldo aperto: un tocco e si apre il loro estratto. I pulsanti <em>Stampa / PDF</em> (su carta intestata, con l\'elenco dei documenti ancora aperti), <em>Excel</em>, <em>CSV</em> e <em>Invia</em> (e-mail pronta, testo anche negli appunti) lo rendono estraibile. <em>Elenco fatture</em> mostra la sola lista delle fatture.</p>'+
 '<p><strong>Uso rapido</strong> — nella barra laterale <em>+ Scalo</em> e <em>+ Fattura</em> aprono subito una scheda nuova. Nella maschera fatture i campi essenziali sono in cima e gli altri (IVA, ritenuta, scadenza, pagamenti, note, allegato) sotto <em>Altri dati</em>; <em>Invio</em> salva; fornitore e data dell\'ultima fattura restano proposti per la successiva. Negli <em>Scali</em> i filtri sono pulsanti (in porto, in arrivo, da incassare…) e le colonne si ordinano toccando l\'intestazione. Sul telefono le tabelle diventano schede e la barra delle sezioni resta fissa in alto.</p>'+
 '<p><strong>Fornitori</strong> — estratto conto per fornitore con fatture aperte e pagate, per anno; <strong>Riepilogo</strong> — totali dell\'anno, da incassare e da pagare, doppioni, voci dove il preventivo si scosta di più dal consuntivo, scali per mese.</p>'+
 '<p><strong>Archivio</strong> — i dati restano in questo browser e, quando l\'app è aperta da claude.ai, anche nell\'archivio condiviso con i colleghi. In <em>Impostazioni → Archivio</em> si esporta un backup completo, si reimporta, e si importano i dati esistenti dal backup di Pratiche di Scalo (file BACKUP_PRATICHE_*.json) e dal CSV esportato dal Mastrino Approdi (mastrino_approdi.csv).</p>'+
 '</div></div>'; }

function leggiTariffe(){ var C=S.cfgRaw; ["pil","orm","tug"].forEach(function(t){ var rows={}; document.querySelectorAll('[data-t="'+t+'"]').forEach(function(i){ var bi=i.getAttribute("data-bi"), f=i.getAttribute("data-bf"); (rows[bi]=rows[bi]||[0,0,0])[f]=num(i.value)||0; });
    C[t]={step:num(val("t_"+t+"_step"))||S.cfg[t].step,extra:num(val("t_"+t+"_extra"))||0,bands:Object.keys(rows).sort(function(a,b){ return a-b; }).map(function(k){ return rows[k]; }).sort(function(a,b){ return a[0]-b[0]; })}; });
  C.transfer=num(val("t_transfer"))||0; C.anc={ue30:num(val("t_anc_ue30"))||0,ex30:num(val("t_anc_ex30"))||0,ue1y:num(val("t_anc_ue1y"))||0,ex1y:num(val("t_anc_ex1y"))||0}; C.chim={defum:num(val("t_chim_defum"))||0,soia:num(val("t_chim_soia"))||0,ciabattato:num(val("t_chim_ciabattato"))||0}; }

    var v={k:old.k,label:i.value.trim(),forn:g("data-vf").value.split(",").map(function(x){ return upper(x); }).filter(Boolean),kw:g("data-vk").value.split(",").map(function(x){ return upper(x); }).filter(Boolean)}; var s=num(g("data-vs").value); if(s!==null) v.std=s; var a=g("data-va").value; if(a) v.auto=a; if(g("data-vi").checked) v.int=true; if(old.opz) v.opz=true; if(v.label) out.push(v); }); S.cfgRaw.voci=out; }

    var d=Object.assign({},S.cfg.doc); ["layout","lingua","colore","titoloPda","titoloFda","notaPda","notaFda","piede"].forEach(function(k){ d[k]=val("d_"+k); }); ["mostraFax","mostraEmail","mostraPiva","mostraMessrs","mostraBanca","mostraFirma","nascondiZero"].forEach(function(k){ d[k]=val("d_"+k); });

/* ---------- archivio incorporato nel file ---------- */
function caricaSeed(){ var d=window.PORTOLANO_SEED; if(!d) return 0; var n=0; for(var k in d.scali||{}){ if(!S.scali[k]){ S.scali[k]=d.scali[k]; n++; } } for(var j in d.spese||{}){ if(!S.spese[j]) S.spese[j]=d.spese[j]; } if(d.cfg&&!Object.keys(S.cfgRaw).length){ S.cfgRaw=d.cfg; S.cfg=merge(CFG_DEFAULT,S.cfgRaw); } salvaLocale(); return n; }
/* ---------- avvio ---------- */
document.getElementById("nav").addEventListener("click",function(e){ var nv=document.getElementById("nav"), m=e.target.closest(".navmore"), c=e.target.closest(".navcerca"); if(c){ nv.classList.remove("more"); var q=document.getElementById("qg"); if(q){ window.scrollTo(0,0); q.focus(); q.select(); } return; } if(m){ nv.classList.toggle("more"); m.setAttribute("aria-expanded",String(nv.classList.contains("more"))); return; } var b=e.target.closest("[data-view]"); if(!b) return; nv.classList.remove("more"); S.view=b.getAttribute("data-view"); S.sel=null; S.editSpesa=null; S.dupWarn=null; S.bozza=null; S.pagTmp=null; S.hl=null; S.qg=""; var q=document.getElementById("qg"); if(q) q.value=""; render(); });
document.addEventListener("keydown",function(e){ var q=document.getElementById("qg"); if(!q) return; var ae=document.activeElement, scrive=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae!==q; if((e.key==="k"||e.key==="K")&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); q.focus(); q.select(); } else if(e.key==="/"&&!scrive&&ae!==q){ e.preventDefault(); q.focus(); q.select(); } else if(e.key==="Escape"&&ae===q&&q.value){ q.value=""; S.qg=""; if(S.view==="cerca") S.view="cruscotto"; render(); } });
document.getElementById("qg").addEventListener("input",function(){ S.qg=this.value; S.sel=null; S.editSpesa=null; S.bozza=null; S.pagTmp=null; if(S.qg.trim()){ S.view="cerca"; } else if(S.view==="cerca") S.view="cruscotto"; render(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&S.doc){ S.doc=null; var w=document.getElementById("docwrap"); if(w) w.remove(); } });
leggiLocale(); if(window.PORTOLANO_SEED&&!Object.keys(S.scali).length){ caricaSeed(); } render();
(async function(){ if(!(window.claude&&window.claude.use)) return;
  try{ var u=await Promise.all([claude.use("db").catch(function(){ return null; }),claude.use("user").catch(function(){ return null; }),claude.use("downloads").catch(function(){ return null; })]); S.db=u[0]; S.downloads=u[2];
    if(u[1]){ try{ var me=await u[1].me(); S.user={id:me&&me.id,nome:(me&&me.name)||""}; }catch(e){} }
    if(!S.db){ render(); return; }
    S.db.collection("scali").onSnapshot(function(sn){ var m={}; sn.docs.forEach(function(d){ var v=clone(d.data()||{}); v.id=v.id||d.id; m[v.id]=v; }); if(sn.docs.length||Object.keys(S.scali).length===0) S.scali=m; salvaLocale(); render(); },function(){});
    S.db.collection("spese").onSnapshot(function(sn){ var m={}; sn.docs.forEach(function(d){ var v=clone(d.data()||{}); v.id=v.id||d.id; m[v.id]=v; }); if(sn.docs.length||Object.keys(S.spese).length===0) S.spese=m; salvaLocale(); render(); },function(){});
    S.db.doc("config/main").onSnapshot(function(sn){ if(sn&&sn.exists&&sn.data()){ S.cfgRaw=clone(sn.data()); S.cfg=merge(CFG_DEFAULT,S.cfgRaw); salvaLocale(); render(); } },function(){});
    /* prima apertura con archivio condiviso vuoto ma dati locali: li carica */
    setTimeout(async function(){ try{ var q=await S.db.collection("scali").limit(1).get(); if(!q.docs.length&&Object.keys(S.scali).length){ for(var k in S.scali) await S.db.doc("scali/"+k).set(S.scali[k]); for(var j in S.spese) await S.db.doc("spese/"+j).set(S.spese[j]); if(Object.keys(S.cfgRaw).length) await S.db.doc("config/main").set(S.cfgRaw); avviso("Archivio locale caricato in quello condiviso."); } }catch(e){} },1500);
  }catch(e){ render(); } })();
