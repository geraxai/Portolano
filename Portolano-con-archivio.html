 ovunque compaia.</p><p><strong>Conto PDA / FDA</strong> — il consuntivo si compone dalle fatture registrate, con le voci interne senza fattura (H.Master, informer, ISPS, bolli…) riprese dal PDA; il <em>Confronto</em> mette a fianco preventivo e consuntivo voce per voce e in rosso i costi in più. <strong>Stampa / PDF</strong> apre il documento con carta intestata, Messrs, tabella nave, voci, totale, banca e firma: si salva in PDF dalla finestra di stampa del browser.</p><p><strong>Incassi</strong> — bonifici ricevuti dal cliente; lo stato dello scalo (preventivo, da incassare, parziale, saldato) si aggiorna da solo. Con <em>PAG DIR</em> il cliente paga i fornitori direttamente e lo scalo resta fuori dai residui.</p><p><strong>Fatture</strong> — la maschera per registrare le fatture fornitori appena arrivano, anche in blocco e senza conoscere ancora lo scalo: al passo 2 si sceglie l'approdo (in cima all'elenco gli scali con ETA vicina alla data fattura) e con <em>Abbina</em> la fattura entra nel conto FDA di quello scalo. Le fatture in attesa compaiono anche nella scheda di ogni scalo (<em>abbina a questo scalo</em>) e nell'estratto conto fornitori come <em>da abbinare</em>.</p><p><strong>General infos e ricerca</strong> — all'apertura la pagina <em>General infos</em> mostra navi in porto e in arrivo, fatture in scadenza, clienti in ritardo e fatture da abbinare; la casella in alto a sinistra cerca in tutto l'archivio (navi, IMO, clienti, fornitori, numeri di fattura). Ogni fattura può avere <em>imponibile, IVA e ritenuta</em> (il totale si calcola da solo), essere una <em>nota di credito</em>, avere <em>più pagamenti</em> (acconti) e un <em>allegato</em> (link, oppure il PDF conservato in questo browser). In <em>Impostazioni → Archivio</em> si chiude il periodo contabile, si imposta il backup automatico e si consulta il registro delle modifiche.</p><p><strong>Contabilità</strong> — i prospetti da contabile, tutti esportabili in CSV (Excel) e stampabili: <em>Registro ncy fees). Nella registrazione e nel conto PDA/FDA restano una voce distinta come sempre; in <em>Contabilità</em> invece prendono il nome dell'azienda (Impostazioni → Contabilità) e sono trattate come fatture <em>emesse</em>: stanno nel registro <em>Fatture emesse</em> e nel <em>Registro IVA</em> tra le vendite (IVA a debito), non tra le fatture ricevute, lo scadenzario fornitori o i pagamenti; nella pagina <em>Fornitori</em> il loro estratto conto è quello delle fatture emesse (fatturato, incassato, da incassare).</p><p><strong>Fatture emesse</strong> — nel <em>Conto PDA / FDA</em> il FDA può ricevere un numero progressivo di fattura (<em>assegna il prossimo numero</em>, formato in Impostazioni → Contabilità) e una data: compaiono sul documento stampato e nel registro <em>Fatture emesse</em> della Contabilità, che segnala numeri mancanti o doppi e mostra incassato e residuo per ogni fattura.</p><p><strong>Statistiche</strong> — in Contabilità, confronto anno su anno per cliente, nave, fornitore, operazione, ormeggio o mese: scali, PDA, FDA, costi fornitori, margine e incassi, con variazione percentuale.</p><p><strong>Estratti conto</strong> — la pagina <em>Fornitori</em> e, in Contabilità, <em>Estratto conto cliente</em> mostrano i movimenti in ordine di data con saldo progressivo: fatture (o conti FDA) da una parte, pagamenti (o incassi) dall'altra, totali per mese, stato di ogni documento e riquadri con fatturato, pagato, saldo e scaduto. In alto la striscia dei fornitori/clienti con saldo aperto: un tocco e si apre il loro estratto. I pulsanti <em>Stampa / PDF</em> (su carta intestata, con l'elenco dei documenti ancora aperti), <em>Excel</em>, <em>CSV</em> e <em>Invia</em> (e-mail pronta, testo anche negli appunti) lo rendono estraibile. <em>Elenco fatture</em> mostra la sola lista delle fatture.</p><p><strong>Uso rapido</strong> — nella barra laterale <em>+ Scalo</em> e <em>+ Fattura</em> aprono subito una scheda nuova. Nella maschera fatture i campi essenziali sono in cima e gli altri (IVA, ritenuta, scadenza, pagamenti, note, allegato) sotto <em>Altri dati</em>; <em>Invio</em> salva; fornitore e data dell'ultima fattura restano proposti per la successiva. Negli <em>Scali</em> i filtri sono pulsanti (in porto, in arrivo, da incassare…) e le colonne si ordinano toccando l'intestazione. Sul telefono le tabelle diventano schede e la barra delle sezioni resta fissa in alto.</p><p><strong>Fornitori</strong> — estratto conto per fornitore con fatture aperte e pagate, per anno; <strong>Riepilogo</strong> — totali dell'anno, da incassare e da pagare, doppioni, voci dove il preventivo si scosta di più dal consuntivo, scali per mese.</p><p><strong>Archivio</strong> — i dati restano in questo browser e, quando l'app è aperta da claude.ai, anche nell'archivio condiviso con i colleghi. In <em>Impostazioni → Archivio</em> si esporta un backup completo, si reimporta, e si importano i dati esistenti dal backup di Pratiche di Scalo (file BACKUP_PRATICHE_*.json) e dal CSV esportato dal Mastrino Approdi (mastrino_approdi.csv).</p></div></div>`}function impostazioni(){var a=[["agenzia","Intestazione"],["banche","Banche"],["tariffe","Tariffe"],["voci","Voci del conto"],["liste","Liste"],["archivio","Archivio"]],e=S.cfg,i='<div class="top"><h1>Impostazioni</h1></div><div class="panel"><div class="subtabs" role="tablist">'+a.map(function(r){return'<button role="tab" data-imp="'+r[0]+'" aria-selected="'+(S.imp===r[0])+'">'+r[1]+"</button>"}).join("")+'</div><div class="panel-b">';if(S.imp==="agenzia"){var t=e.ag,n=e.doc;i+=`<h3>Carta intestata dell'agenzia</h3><div class="grid" style="margin:8px 0 14px">`+campo("ag_nome","Ragione sociale",t.nome,"text",{cls:"w2"})+campo("ag_nomeBreve","Nome breve",t.nomeBreve)+campo("ag_sottotitolo","Sottotitolo",t.sottotitolo)+campo("ag_indirizzo","Indirizzo",t.indirizzo,"text",{cls:"w2"})+campo("ag_citta","Città (data documento)",t.citta)+campo("ag_tel","Telefono",t.tel)+campo("ag_fax","Fax",t.fax)+campo("ag_   async function leggiUno(nome,buf,righe){ try{
