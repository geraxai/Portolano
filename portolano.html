la stessa nave/IMO o della stessa data e con <em>Carica</em> nave, viaggio e (se vuoi) il PDA entrano nello scalo. Il file resta in memoria sul dispositivo: per gli scali successivi basta <em>Scegli la pratica</em>. <em>Importa tutte nell'archivio</em> crea o aggiorna uno scalo per ogni pratica. In Pratiche di Scalo il pulsante <em>Per Portolano</em> (archivio, o in fondo alla pratica) salva il file di <strong>una sola nave</strong> (PORTOLANO_NAVE_*.json) con il <strong>PDA inviato</strong>: caricato nella scheda, nave, viaggio e PDA entrano nello scalo da soli, con gli stessi importi inviati al cliente. Premendo <em>+ Nuovo scalo</em> uno scalo vuoto già aperto viene riusato e gli scali lasciati vuoti si eliminano da soli.</p><p><strong>Intestazione</strong> — il destinatario del conto (Messrs) riga per riga, riprendibile dagli scali precedenti, e la banca da indicare sul documento. La carta intestata dell'agenzia (ragione sociale, indirizzo, recapiti, P.IVA, logo, colore, lingua, firma) si imposta una volta in <em>Impostazioni → Intestazione</em> e vale per tutti i documenti.</p><p><strong>PDA preventivo</strong> — calcolato dalle tariffe per scaglioni di GT: piloti, ormeggiatori e rimorchiatori × numero di prestazioni (con trasferimento rimorchiatori a 2 mezzi), tassa d'ancoraggio per NT, chimico, più gli importi standard delle voci d'agenzia. Ogni voce si può forzare a mano; le voci in corsivo ottone sono automatiche. Gli scaglioni sono quelli dei fogli PILOTI, ORMEGGIATORI, TUG e TASSA ANC del file APPRODO.xlsx e si modificano in <em>Impostazioni → Tariffe</em>.</p><p><strong>Fatture fornitori</strong> — ogni fattura si registra sulla voce del conto (proposta automaticamente dal fornitore: PILOTI → Pilotage, SIDRA → Fresh water…). Se una fattura risulta già registrata (stesso fornitore e numero, o stessa nave/importo/data) l'app avvisa prima di salvare e la segna con <span class="chip no">addebitata 2 volte</span> ovunque compaia. <strong>Ns fattura di commissione</strong>: nel campo <em>Documento</em> scegli «Ns fattura di commissione al fornitore» per registrare la provvigione che l'azienda fattura a un fornitore (rimorchiatori, piloti…): non è un costo dello scalo, in Contabilità è una fattura emessa e nell'estratto conto del fornitore va in avere, riducendo quanto gli dobbiamo; il suo incasso o la compensazione si registra come pagamento.</p><p><strong>Conto PDA / FDA</strong> — il consuntivo rispecchia le fatture registrate e assegnate allo scalo: quelle dei fornitori voce per voce e la ns fattura Fratelli Bonanno scomposta nelle sue voci (agency fees, ISPS, bolli, dogana…), il cui numero e data compaiono anche sul documento FDA; le voci interne senza fattura (H.Master, informer, ISPS, bolli…) sono riprese dal PDA solo finché allo scalo non è assegnata una ns fattura; il <em>Confronto</em> mette a fianco preventivo e consuntivo voce per voce e in rosso i costi in più. <strong>Stampa / PDF</strong> apre il documento con carta intestata, Messrs, tabella nave, voci, totale, banca e firma: si salva in PDF dalla finestra di stampa del browser.</p><p><strong>Incassi</strong> — bonifici ricevuti dal cliente; lo stato dello scalo (preventivo, da incassare, parziale, saldato) si aggiorna da solo. Con <em>PAG DIR</em> il cliente paga i fornitori direttamente e lo scalo resta fuori dai residui.</p><p><strong>Fatture</strong> — la maschera per registrare le fatture fornitori appena arrivano, anche in blocco e senza conoscere ancora lo scalo: al passo 2 si sceglie l'approdo (in cima all'elenco gli scali con ETA vicina alla data fattura) e con <em>Abbina</em> la fattura entra nel conto FDA di quello scalo. Le fatture in attesa compaiono anche nella scheda di ogni scalo (<em>abbina a questo scalo</em>) e nell'estratto conto fornitori come <em>da abbinare</em>.</p><p><strong>General infos e ricerca</strong> — all'apertura la pagina <em>General infos</em> mostra navi in porto e in arrivo, fatture in scadenza, clienti in ritardo e fatture da abbinare; la casella in alto a sinistra cerca in tutto l'archivio (navi, IMO, clienti, fornitori, numeri di fattura). Ogni fattura può avere <em>imponibile, IVA e ritenuta</em> (il totale si calcola da solo), essere una <em>nota di credito</em>, avere <em>più pagamenti</em> (acconti) e un <em>allegato</em> (link, oppure il PDF conservato in questo browser). In <em>Impostazioni → Archivio</em> si chiude il periodo contabile, si imposta il backup automatico e si consulta il registro delle modifiche.</p><p><strong>Contabilità</strong> — i prospetti da contabile, tutti esportabili in CSV (Excel) e stampabili: <em>Registro fatture</em> ricevute con filtri e ricerca; <em>Scadenzario fornitori</em> (sospesi passivi per fornitore, con scadenza = data fattura + 30 giorni salvo scadenza indicata, e ritardo in giorni); <em>Partite aperte clienti</em> (conti FDA non ancora incassati, per cliente, con anzianità); <em>Estratto conto cliente</em> (addebiti FDA e incassi in ordine di data con saldo progressivo); <em>Prima nota</em> (incassi e pagamenti per mese e per banca). Nelle fatture la voce del conto può essere anche scritta a mano libera (<em>Altra voce</em>): nel FDA le fatture con lo stesso nome si sommano in una riga e si confrontano con la voce aggiuntiva del PDA che ha lo stesso nome.</p><p><strong>Fatture elettroniche</strong> — nella pagina <em>Fatture</em> il riquadro <em>Importa fatture elettroniche (XML)</em> legge i file XML (o .p7m) ricevuti dallo SDI: fornitore, numero, data, imponibile, IVA, ritenuta, totale, scadenza e descrizione si compilano da soli, l'app propone la voce del conto e lo scalo e segnala le fatture già registrate; il fornitore scelto per una partita IVA viene ricordato per le volte successive.</p><p><strong>Importazione fatture (XML, PDF, ZIP)</strong> — nella pagina <em>Fatture</em> e nella pagina <em>Fornitori</em> puoi caricare gli XML/P7M dello SDI, i PDF delle fatture (letti dal testo; le scansioni senza testo non si leggono) o u
